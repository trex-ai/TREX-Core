[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/TREX_Core"]


[project]
name = "trex-core"
version = "5.0.0"
description = "TREX Core"
requires-python = ">=3.12"
readme = "README.md"
authors = [
    { name = "TREX AI" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "async-lru==2.2.0",
    "asyncpg==0.31.0",
    "commentjson==0.9.0",
    "cuid2==2.0.1",
    "databases[postgresql]==0.9.0",
    "gmqtt==0.7.0",
    "numpy==2.4.2",
    "orjson==3.11.7",
    "packaging==26.0",
    "paho-mqtt==2.1.0",
    "psycopg[binary]==3.2.6",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.1.post1",
    "sqlalchemy==2.0.48",
    "sqlalchemy-utils==0.42.1",
    "structlog==25.5.0",
    "uvloop==0.22.1; platform_system != 'Windows'",
]


[project.optional-dependencies]
dev = [
    "bandit==1.9.4",
    "detect-secrets==1.5.0",
    "mypy==1.19.1",
    "pip-audit==2.10.0",
    "pre-commit==4.5.1",
    "ruff==0.15.5",
    "types-python-dateutil==2.9.0.20260305",
    "types-pytz==2026.1.1.20260304",
]
test = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
    "pytest-timeout==2.4.0",
]


# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88
fix = true

src = ["src", "tests"]
extend-exclude = [
    "migration_path",
    "services/data",
    "services/logs",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "ERA",  # eradicate (commented-out code)
    "PL",   # pylint
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",   # assert used (ok in tests)
    "S104",   # binding to all interfaces (intentional in servers)
    "PLR0913", # too many arguments (some domain functions need them)
    "PLR2004", # magic value comparison (too noisy initially)
    "ERA001",  # commented-out code (enable after cleanup)
    "N806",   # variable in function should be lowercase (numpy conventions)
]


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is fine in tests
    "ARG001",  # unused function args (fixtures)
    "ARG002",  # unused method args (fixtures)
    "PLR2004", # magic values in tests
]

"src/TREX_Core/configs/**" = ["S105", "S106"]  # hardcoded passwords in config examples

[tool.ruff.lint.isort]
known-first-party = ["TREX_Core"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false
line-ending = "lf"



# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
pretty = true
show_error_codes = true
exclude = [
    "^migration_path/",
    "^services/data/",
    "^services/logs/",
]

[[tool.mypy.overrides]]
module = ["TREX_Core.main"]
ignore_errors = true


[[tool.mypy.overrides]]
module = [
    "commentjson",
    "cuid2",
    "databases",
    "gmqtt",
    "paho.*",
    "sqlalchemy",
    "sqlalchemy_utils",
    "tensorflow",
    "tensorflow_probability",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-v",
    "--tb=short",
    "--cov=TREX_Core",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=0", # change this after we start writing tests
]

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services (MQTT, PostgreSQL)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:sqlalchemy.*",
    "ignore::DeprecationWarning:databases.*",
]

[tool.coverage.run]
branch = true
source = ["TREX_Core"]
omit = [
    "src/TREX_Core/configs/*",
    "src/TREX_Core/scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "migration_path"]
skips = ["B101"]
